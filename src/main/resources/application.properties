# ==============================================================================
# Backend Integrado - Pastelería Mil Sabores
# Configuración del entorno de ejecución (Spring Boot 3.3.4 / Java 21)
# ==============================================================================

# 1. Configuración del servidor embebido
# Puerto estándar 8080 para comunicación con el frontend React
server.port=8080
spring.application.name=pasteleria-backend

# 2. Configuración de base de datos en memoria (H2) para pruebas locales rápidas
spring.datasource.url=jdbc:h2:mem:pasteleriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para auditoría visual en navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 3. Configuración de JPA e Hibernate (ORM)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Configuración de Swagger / OpenAPI 3
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

