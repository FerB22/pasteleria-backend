# =====================================================================
# Perfil de configuración para PostgreSQL (Pastelería Mil Sabores)
# Activar al iniciar el backend con:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Variables de entorno opcionales: PG_HOST, PG_PORT, PG_DB, PG_USER, PG_PASSWORD
# =====================================================================

spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:pasteleria_db}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto JPA/Hibernate y sincronización automática del esquema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita reejecutar schema.sql/data.sql (sintaxis H2/MySQL) al usar PostgreSQL;
# DataInitializer carga los usuarios iniciales con BCrypt de forma idempotente.
spring.sql.init.mode=never
spring.h2.console.enabled=false
