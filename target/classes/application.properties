# Backend Integrado - Pastelería Mil Sabores
# Configuración del entorno de ejecución (Spring Boot 3.3.4 / Java 21)

# Configuración del servidor embebido
# Puerto estándar 8080 para comunicación con el frontend React
server.port=8080
spring.application.name=pasteleria-backend

# Configuración de base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pasteleriadb
spring.datasource.username=postgres
spring.datasource.password=P3P%2oo/
spring.datasource.driver-class-name=org.postgresql.Driver

# Las tablas y datos se crean con pasteleria_postgres.sql (se ejecuta a mano en pgAdmin)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:pasteleria_postgres.sql

# Configuración de JPA e Hibernate (ORM)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración avanzada de Swagger / OpenAPI 3
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true